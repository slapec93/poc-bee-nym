x-sidecar: &sidecar
  image: bee-nym-sidecar
  build: ../sidecar
  cap_add: [NET_ADMIN]
  restart: "no"

services:
  nym-1:
    <<: *sidecar
    environment: { NODE_IP: "10.0.0.11" }
    volumes: ["nym-peers:/peers", "nym-state-1:/state"]
    ports: ["21633:1633"]
    networks: { beenet: { ipv4_address: 10.0.0.11 } }
    healthcheck: { test: ["CMD", "test", "-f", "/peers/10.0.0.11"], interval: 2s, retries: 120 }

  bee-1:
    network_mode: service:nym-1
    networks: !reset {}
    ports: !reset []
    depends_on:
      nym-1: { condition: service_healthy }

  nym-2:
